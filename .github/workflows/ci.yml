name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Verifying therain2020-agent structure ==="

          # Core source must exist
          test -f src/main.tsx || { echo "MISSING: src/main.tsx"; exit 1; }
          test -f src/Tool.ts || { echo "MISSING: src/Tool.ts"; exit 1; }
          test -f src/tools.ts || { echo "MISSING: src/tools.ts"; exit 1; }

          # New self-modification services
          test -f src/services/SelfModService/SelfModService.ts || { echo "MISSING: SelfModService"; exit 1; }
          test -f src/services/SelfModService/Sandbox.ts || { echo "MISSING: Sandbox"; exit 1; }
          test -f src/services/SelfModService/EvolutionLoop.ts || { echo "MISSING: EvolutionLoop"; exit 1; }
          test -f src/services/SelfModService/types.ts || { echo "MISSING: SelfModService types"; exit 1; }

          test -f src/services/DynamicToolRegistry.ts || { echo "MISSING: DynamicToolRegistry"; exit 1; }
          test -f src/services/EvolvedPromptStore.ts || { echo "MISSING: EvolvedPromptStore"; exit 1; }
          test -f src/services/CapabilityGapDetector.ts || { echo "MISSING: CapabilityGapDetector"; exit 1; }

          # New tools
          test -f src/tools/SelfHealTool.ts || { echo "MISSING: SelfHealTool"; exit 1; }
          test -f src/tools/EvolveTool.ts || { echo "MISSING: EvolveTool"; exit 1; }

          # New commands
          test -f src/commands/evolve-undo.ts || { echo "MISSING: evolve-undo"; exit 1; }
          test -f src/commands/evolution-status.ts || { echo "MISSING: evolution-status"; exit 1; }

          # Documentation
          test -f README.md || { echo "MISSING: README.md"; exit 1; }
          test -f CLAUDE.md || { echo "MISSING: CLAUDE.md"; exit 1; }

          echo "=== All checks passed ==="

      - name: Count files
        run: |
          echo "Source files:"
          find src/ -name "*.ts" -o -name "*.tsx" | wc -l
          echo ""
          echo "New self-mod files:"
          echo "  services/SelfModService/"
          ls src/services/SelfModService/
          echo "  services/"
          ls src/services/*.ts
          echo "  tools/"
          ls src/tools/SelfHealTool.ts src/tools/EvolveTool.ts
          echo "  commands/"
          ls src/commands/evolve-undo.ts src/commands/evolution-status.ts
