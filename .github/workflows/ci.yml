name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Verify project structure
        run: |
          echo "=== Verifying therain2020-agent structure ==="

          test -f package.json || { echo "MISSING: package.json"; exit 1; }
          test -f tsconfig.json || { echo "MISSING: tsconfig.json"; exit 1; }
          test -f src/main.tsx || { echo "MISSING: src/main.tsx"; exit 1; }
          test -f src/Tool.ts || { echo "MISSING: src/Tool.ts"; exit 1; }

          # Self-modification services
          for f in \
            src/services/SelfModService/SelfModService.ts \
            src/services/SelfModService/Sandbox.ts \
            src/services/SelfModService/EvolutionLoop.ts \
            src/services/SelfModService/types.ts \
            src/services/DynamicToolRegistry.ts \
            src/services/EvolvedPromptStore.ts \
            src/services/CapabilityGapDetector.ts \
            src/tools/SelfHealTool.ts \
            src/tools/EvolveTool.ts \
            src/commands/evolve-undo.ts \
            src/commands/evolution-status.ts
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

          echo "=== Structure OK ==="

      - name: Type check
        run: bun run --bun tsc --noEmit 2>&1 | head -50 || true
