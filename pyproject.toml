[project]
name = "therain2020-agent"
version = "0.8.0"
description = "Thin AI agent harness — less framework, more agent"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "structlog>=24.0",
    "websockets>=13.0",
    "rich>=13.0",
    "textual>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
therain2020-agent = "agent.cli:main"
therain2020 = "therain2020.run:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "therain2020*"]

[tool.setuptools.package-data]
agent = ["**/*.md", "**/*.yaml", "**/*.yml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["N818", "N801", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
