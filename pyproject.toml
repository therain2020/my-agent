[project]
name = "therain2020-agent"
version = "0.9.0"
description = "Thin AI agent harness — self-evolving, Claude Code-style memory"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.0",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "websocket-client>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
therain2020 = "therain2020.run:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["therain2020*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["N818", "N801", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
